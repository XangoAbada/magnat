[workspace]
resolver = "2"
members = [
    "engine/core",
    "engine/ecs",
    "engine/jobs",
    "engine/nav",
    "engine/io",
    "engine/devtools",
    "engine/render",
    "engine/spatial",
    "engine/ui",
    "engine/voxel",
    "sim/agents",
    "sim/economy",
    "sim/firms",
    "sim/macro",
    "sim/policy",
    "sim/snapshot",
    "sim/supply",
    "sim/traffic",
    "sim/world",
    "tools/balansator",
    "tools/goods-graph",
    "tools/headless",
    "tools/magnat",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Proprietary"
publish = false

# Wersje przypięte w jednym miejscu (M0 §5.0). Granica bibliotek zewnętrznych: PRD §16.1.
[workspace.dependencies]
magnat-core = { path = "engine/core" }
magnat-ecs = { path = "engine/ecs" }
magnat-jobs = { path = "engine/jobs" }
magnat-nav = { path = "engine/nav" }
magnat-io = { path = "engine/io" }
magnat-devtools = { path = "engine/devtools" }
magnat-render = { path = "engine/render" }
magnat-spatial = { path = "engine/spatial" }
magnat-ui = { path = "engine/ui" }
magnat-agents = { path = "sim/agents" }
magnat-economy = { path = "sim/economy" }
magnat-firms = { path = "sim/firms" }
magnat-macro = { path = "sim/macro" }
magnat-policy = { path = "sim/policy" }
magnat-sim-snapshot = { path = "sim/snapshot" }
magnat-supply = { path = "sim/supply" }
magnat-traffic = { path = "sim/traffic" }
magnat-voxel = { path = "engine/voxel" }
magnat-world = { path = "sim/world" }
# Klient i balansator stawiają **tę samą** gospodarkę co scenariusz `m5shop`
# (`AB-1`), a most „zakłady Etapu 7 → rynek" mieszka w bibliotece headlessa
# (decyzja otwarta nr 10 fazy M5). Zależność idzie wyłącznie od narzędzi do niej.
magnat-headless = { path = "tools/headless" }

serde = { version = "1.0.229", features = ["derive"] }
xxhash-rust = { version = "0.8.18", features = ["xxh3", "const_xxh3"] }
indexmap = "2.14.2"
rayon = "1.12.0"
parking_lot = "0.12.5"
fixedbitset = "0.5.7"
smallvec = { version = "1.16.1", features = ["union", "const_generics"] }
ron = "0.12.2"
bincode = { version = "2.0", features = ["serde"] }
zstd = "0.14.0"
clap = { version = "4.6.6", features = ["derive"] }
tracy-client = "0.18"

proptest = "1.11.0"
criterion = "0.8.2"
trybuild = "1.0.121"

wgpu = "30.0.1"
winit = "0.30"
# Biblioteka UI (M3 decyzja 9.2). Wersja jest sprzężona z `wgpu`: egui-wgpu 0.36
# wymaga wgpu ^30, a 0.33 wymagałoby wgpu ^27 — czyli drugiego `wgpu` w drzewie.
# To ta zależność podnosi `rust-version` workspace'u do 1.95.
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = { version = "0.36.2", default-features = false }
# Walidator WGSL — dev-only. Shader jest sprawdzany dopiero przy tworzeniu urządzenia,
# czyli przy oknie; `naga` pozwala sprawdzić go w CI bez GPU (M1 §7.3).
naga = { version = "30.0.1", features = ["wgsl-in"] }
glam = "0.33.7"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"

[workspace.lints.clippy]
# Każdy blok `unsafe` ma nieść komentarz SAFETY (00 §6). Jedyny crate z `unsafe`
# to engine/ecs, ale lint stoi na poziomie workspace, żeby nie trzeba go było
# dokładać w fazie, która pierwsza sięgnie po surową pamięć.
undocumented_unsafe_blocks = "warn"

[profile.dev]
opt-level = 0
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
# panic = "abort" ŚWIADOMIE WYŁĄCZONE: JobPool przenosi panikę workera
# na wątek wywołujący przez catch_unwind (M0 §5.4, WP-06).
panic = "unwind"

[profile.bench]
inherits = "release"
debug = true
