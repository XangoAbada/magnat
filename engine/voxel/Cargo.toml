[package]
name = "magnat-voxel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Testy jednostkowe nie są benchmarkami. Bez tego `cargo bench` próbuje uruchomić
# bibliotekę jako bench target i przewraca się na flagach criteriona, których libtest
# nie zna — a bramka regresji z D-8 przestaje działać, zanim cokolwiek zmierzy.
[lib]
bench = false

[dependencies]
magnat-core = { workspace = true }
magnat-jobs = { workspace = true }
# Quaterniony przy składaniu póz animacji (M11b §5.4). Ta sama wersja, co w renderze —
# atlas póz jedzie do shadera bez konwersji, więc dwie biblioteki byłyby dwiema
# konwencjami kolejności składowych.
glam = { workspace = true }
smallvec = { workspace = true }
parking_lot = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "voxel_bench"
harness = false
