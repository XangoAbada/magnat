[package]
name = "magnat-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Testy jednostkowe nie są benchmarkami. Bez tego `cargo bench` próbuje uruchomić
# bibliotekę jako bench target i przewraca się na flagach criteriona, których libtest
# nie zna — a bramka regresji z D-8 przestaje działać, zanim cokolwiek zmierzy.
[lib]
bench = false

[dependencies]
magnat-core = { workspace = true }
magnat-ecs = { workspace = true }
bincode = { workspace = true }
zstd = { workspace = true }
xxhash-rust = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "io_bench"
harness = false
