[package]
name = "magnat-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
magnat-core = { workspace = true }
magnat-ecs = { workspace = true }
magnat-agents = { workspace = true }
magnat-traffic = { workspace = true }
# Panel sklepu (M5e/WP12) czyta `ShopPanelSnapshot` — jedyne wejście interfejsu
# do gospodarki. Zależność idzie tylko w tę stronę: `sim/economy` nie widzi UI.
magnat-economy = { workspace = true }
# Karta firmy i panel ludzi (M7f WP16). Interfejs czyta **migawkę**
# (`FirmPanelSnapshot`), a nie rejestr — zależność jest jednokierunkowa.
magnat-firms = { workspace = true }
# Zakładka danin w karcie firmy (M8a WP2). `sim/firms` nie widzi miasta i widzieć
# nie może — kartę składa więc ten, kto widzi obie strony, czyli prezentacja.
magnat-city = { workspace = true }
# Panel łańcucha dostaw (WP13) czyta `SupplyGraphView` i `BatchTrace` — dane,
# nie stan: obie struktury są oderwane od świata i wolno je trzymać przez klatkę.
magnat-supply = { workspace = true }
egui = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# Tylko po to, żeby złoty test mógł zbudować `LedgerEntry` z prawdziwym `EdgeId`.
magnat-nav = { workspace = true }

[lints]
workspace = true
