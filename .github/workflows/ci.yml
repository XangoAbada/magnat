# CI Magnata (M0 WP-14). Cztery joby, bo cztery różne rzeczy mogą się zepsuć:
# kompilacja i styl, pamięć (Miri), determinizm i wydajność.
#
# Faza dopisuje do tego pliku **przypadki**, nie buduje własnego CI (00 §6).

name: check

on:
  push:
    # Gałąź główna nazywa się `master` (CLAUDE.md, „Reguła: jedna gałąź").
    # Do M5e stało tu `main`, więc push na gałąź, na której powstaje **cała** praca,
    # nie uruchamiał CI ani razu — bramki działały wyłącznie na pull requestach,
    # których w tym projekcie nie ma.
    branches: [master]
  pull_request:
  schedule:
    # Przebieg nocny. ARM (D-10) **nie biegnie** — joba aarch64 nie ma, więc T-D9
    # na ARM jest niepotwierdzony (N1.13, zapis w N8.1).
    - cron: "0 2 * * *"
  # Nocny zestaw na żądanie (`gh workflow run check`) — traktowany jak `schedule`
  # wszędzie, gdzie job rozróżnia bieg nocny od bramki pull requesta.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Jawne `bash` to `bash -eo pipefail` na obu systemach (N1.14). Bez tego krok na
# Windows biegnie w pwsh i zwraca kod **ostatniej** komendy — cztery `cargo test`
# kroku M1 padały po cichu — a domyślny `bash` na Linuksie nie ma `pipefail`,
# więc `cargo test | tee raport` był zielony zawsze. Pilnuje tego `plan_guard` (reguła 5).
defaults:
  run:
    shell: bash

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        # Zakaz libm (00 §K-6) i zakaz HashMap w symulacji (00 §3.2) są egzekwowane
        # przez clippy.toml — dlatego clippy jest bramką, nie ozdobą.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: brak wgpu w headless (R-5)
        shell: bash
        run: |
          if cargo tree -p magnat-headless | grep -q wgpu; then
            echo "wgpu przeniknął do headless" && exit 1
          fi
      - name: dep_isolation — render, voxel i audio nie widzą symulacji (M1 §7.3, M11 §6.3)
        shell: bash
        run: |
          # Uzgodnione z M11: renderer dostaje dane przez `sim-snapshot` i **tylko** przez
          # niego. Gdyby mógł sięgnąć do `sim/world` albo `sim/city`, kontrakt snapshotu
          # przestałby cokolwiek znaczyć — i nikt by tego nie zauważył do M11.
          # `magnat-audio` dołączył w M11d: §6.3 pkt 1 wymienia go obok renderu.
          #
          # Lista **dozwolonych**, nie zakazanych (poprawka M11d, `I-20`). Poprzednia
          # wersja wypisywała zakazane crate'y wzorcem `magnat-(world|city|econ|events|sim)`
          # i przepuszczała siedem z jedenastu: `econ` nie pasuje do `magnat-economy`,
          # `sim` do niczego, a `supply`, `agents`, `traffic`, `firms`, `macro` i `policy`
          # nie były w nim wymienione. Przy liście dozwolonych **nowy crate symulacji
          # zapala bramkę sam**, bez pamiętania o dopisaniu go tutaj.
          DOZWOLONE='^magnat-(core|ecs|jobs|io|nav|devtools|spatial|voxel|render|audio|ui|sim-snapshot)$'
          for crate in magnat-render magnat-voxel magnat-audio; do
            obce=$(cargo tree -p $crate --prefix none               | grep -oE '^magnat-[a-z-]+' | sort -u | grep -vE "$DOZWOLONE" || true)
            if [ -n "$obce" ]; then
              echo "$crate widzi crate'y spoza kontraktu §6.3:" && echo "$obce" && exit 1
            fi
          done

  miri:
    name: miri (ecs + core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # Miri jest wolne, więc obejmuje wyłącznie crate'y z `unsafe` i z arytmetyką
      # bitową — czyli dokładnie te, w których UB byłoby możliwe.
      - name: miri ecs
        run: cargo +nightly miri test -p magnat-ecs --lib
      - name: miri core
        run: cargo +nightly miri test -p magnat-core --lib

  determinism:
    name: determinizm (T-D1, T-D2, T-D8)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Determinizm musi być sprawdzany na obu platformach: rozjazd libm
        # glibc vs MSVC jest najczęstszym przypadkiem (ryzyko R-9).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release -p magnat-headless
      - name: T-D1/T-D2 — ten sam seed, różna liczba wątków
        shell: bash
        run: |
          ./target/release/magnat-headless --seed 42 --entities 100000 --ticks 20000 \
            --hash-every 1000 --threads 1 --out run_1.hashes
          ./target/release/magnat-headless --seed 42 --entities 100000 --ticks 20000 \
            --hash-every 1000 --threads 16 --expect run_1.hashes
      - name: T-D4 — zapis i wznowienie
        shell: bash
        run: |
          ./target/release/magnat-headless --seed 42 --entities 100000 --ticks 10000 \
            --hash-every 1000 --save world.mgs
          ./target/release/magnat-headless --load world.mgs --ticks 10000 \
            --hash-every 1000 --out resumed.hashes
          tail -n 10 run_1.hashes > expected_tail.txt
          tail -n 10 resumed.hashes > actual_tail.txt
          diff expected_tail.txt actual_tail.txt
      - name: M1 — macierz hashy terenu i niezmienniczość wątkowa
        # Macierz 32 seedów × 5 regionów jest zatwierdzona w repo (§7.1): jej zmiana ma
        # być świadoma, więc test biegnie w CI, a nie „czasem u kogoś lokalnie".
        run: |
          cargo test --release -p magnat-world --test determinism -- --include-ignored
          # M2b: kryteria WP3–WP6. Ten sam job, bo to też testy na prawdziwym terenie.
          cargo test --release -p magnat-world --test city -- --include-ignored
          # M2c: kryteria WP7, WP5b, WP8, WP9.
          cargo test --release -p magnat-world --test city_m2c -- --include-ignored
          # **M2d i M3d dołączyły w R2-WP25** i to jest naprawa `D-R7`, nie rozszerzenie
          # zakresu: oba pliki miały testy `#[ignore]`, których `ci.yml` nie wołał **wcale**,
          # więc cztery kryteria akceptacyjne M2d i M3d nie biegły nigdzie od nieznanej
          # liczby faz. Dwadzieścia siedem testów z tych czterech plików chodzi od R2f
          # przy zwykłym `cargo test` na świecie 2 km; tutaj zostaje reszta — ta, która
          # mierzy rozkłady i budżety, czyli potrzebuje 4 albo 8 km.
          #
          # Dwie awarie `city_m2d`, które `D-19` i `D-22` zdiagnozowały jako **przeterminowane
          # testy, a nie zepsuty kod**, są w `R2-WP25` naprawione po stronie testu: wycena
          # porównuje się z `pass_2`, a strefa zieleni wyjmuje parcele z zakładem Etapu 7
          # (korekta `F2` z M2e). Wynik tego kroku mówi log joba, nie ten komentarz (N1.13).
          cargo test --release -p magnat-world --test city_m2d -- --include-ignored
          # `doba_przez_systemy_ecs_planuje_dowozi_i_zaspokaja` jest pominięty **imiennie**,
          # bo wywraca się na `debug_assert` kolejki zdarzeń (`des.rs`) — pozycja 73 wykazu
          # `R2`, adres `R3`. Pominięcie po nazwie, a nie `|| true`: pozostałe sześć testów
          # tego pliku ma paść, jeśli padnie.
          cargo test --release -p magnat-world --test population -- --include-ignored             --skip doba_przez_systemy_ecs_planuje_dowozi_i_zaspokaja
      - name: M4 — kamera, wątki i prędkość nie zmieniają świata (M4d/WP12)
        # Trzy kryteria naraz, bo wszystkie sprowadzają się do jednego pytania: czy coś
        # spoza symulacji przecieka do jej wyniku. `--micro` otwiera okno LOD Mikro, więc
        # ten krok jest `camera_does_not_change_world` (A5) na **pełnym scenariuszu**,
        # a nie tylko na teście jednostkowym — mikro liczy wtedy IDM dla tysięcy pojazdów
        # i nadal nie ma prawa zmienić ani grosza.
        #
        # Dwie doby, nie sto: kryterium WP12 mówi o stu, ale sto dób metropolii to
        # kilkadziesiąt minut na przebieg i cztery przebiegi — to jest bieg nocny,
        # nie bramka pull requesta. Dwie doby łapią wszystko, co zależy od kolejności
        # wątków, bo ta rozjeżdża się w pierwszych minutach albo wcale.
        shell: bash
        run: |
          cargo run --release -q -p magnat-headless -- m3day --size 4km --days 2             --citizens 4000 --hash-every 240 --threads 1 --out m4_mezo.hashes
          cargo run --release -q -p magnat-headless -- m3day --size 4km --days 2             --citizens 4000 --hash-every 240 --threads 16 --expect m4_mezo.hashes
          cargo run --release -q -p magnat-headless -- m3day --size 4km --days 2             --citizens 4000 --hash-every 240 --speed 10 --expect m4_mezo.hashes
          cargo run --release -q -p magnat-headless -- m3day --size 4km --days 2             --citizens 4000 --hash-every 240 --micro 2000 --threads 4 --expect m4_mezo.hashes
      - name: M5 — gospodarka nie zależy od liczby wątków (M5e/WP14, §7.2)
        # Sześć dób, nie dwie: gospodarstwo startuje z pełnym zapasem, a próg
        # zakupowy to cztery doby, więc krótszy przebieg nie uruchamia ani jednej
        # transakcji i porównywałby hashe świata, w którym gospodarka nic nie robi.
        #
        # Złotego pliku w repozytorium nie ma świadomie: wartość hasha zmienia się
        # przy każdym dopisaniu stanu do świata, więc plik w gicie byłby
        # zobowiązaniem do nieruszania niczego, a nie bramką. Porównujemy dwa
        # przebiegi tego samego drzewa.
        shell: bash
        run: |
          cargo run --release -q -p magnat-headless -- m5shop --size 4km --days 6 \
            --citizens 3000 --hash-every 1440 --threads 1 --out m5_t1.hashes
          cargo run --release -q -p magnat-headless -- m5shop --size 4km --days 6 \
            --citizens 3000 --hash-every 1440 --threads 8 --expect m5_t1.hashes
      - name: M8a — budżet miasta domyka się do grosza (T1, WP1/WP2)
        run: cargo test --release -p magnat-headless --test city_tax -- --include-ignored
      - name: M8d — domiar w budżecie i usługi z obsadą (T4, WP7/WP8)
        # Dwa testy z jednego pliku i oba są kryterium zamknięcia podfazy:
        # „domiar trafia do budżetu bez naruszenia T1" oraz „placówka ma prawdziwych
        # ludzi na etatach, a urząd wydaje pozwolenia". Pozostałe trzy kanały skutków
        # (szkoła, opieka zdrowotna, policja) mają testy jednostkowe w `sim/agents`
        # i `sim/economy`, więc chodzą w zwykłym `cargo test`.
        run: cargo test --release -p magnat-headless --test enforcement -- --include-ignored
      - name: M8e — władza rządzi, wybory się odbywają, uchwała dochodzi do półki (T5/T6, WP9–WP11)
        # Trzy testy z jednego pliku i wszystkie trzy są kryterium zamknięcia podfazy.
        # Histereza stawek (T5) i determinizm wyborów (T6) mają testy jednostkowe
        # w `sim/city` i chodzą w zwykłym `cargo test`; tutaj sprawdza się to,
        # czego one sprawdzić nie mogą — że łańcuch domyka się w gospodarce:
        # uchwała wchodzi w życie, `Market` dostaje nowy silnik podatkowy, cena
        # na półce liczy się po nowemu, a rejestr należności dalej domyka się
        # do zera groszy.
        #
        # Kadencję test skraca w `GovTuning` do dwóch miesięcy, bo cztery lata
        # gry to ~1400 dób. Długość kadencji jest **daną** (`K-56`), a nie
        # własnością kodu, który tu mierzymy.
        run: cargo test --release -p magnat-headless --test government -- --include-ignored
      - name: M8a/M8c — determinizm miasta z podatkami, pogodą i zdarzeniami
        # Dwa przebiegi tego samego drzewa, jak przy `m5shop` wyżej i z tego samego
        # powodu: hash zmienia się przy każdym dopisaniu stanu, więc złoty plik
        # w repozytorium byłby zobowiązaniem do nieruszania niczego, a nie bramką.
        #
        # 51 dób, bo tyle potrzeba, żeby przebieg **zapłacił**, a nie tylko naliczył:
        # pierwsza deklaracja miesięczna wypada trzydziestego pierwszego, a termin
        # VAT-u, PIT-u i podatku od nieruchomości jest dwudziestego miesiąca
        # następnego. Przy 35 dobach wpływ miało wyłącznie cło (płatne tego samego
        # dnia) i bramka „≥ 3 daniny z niezerowymi wpływami" była czerwona;
        # przy 51 dobach wpływy ma pięć danin z siedmiu (`CC-16` w `M8b-…md`).
        #
        # Od M8c ten sam przebieg jest **testem T3**: scenariusz `m8miasto` stawia
        # generator zdarzeń, więc porównywany ciąg hashy obejmuje pogodę (proces
        # z pamięcią, liczony co godzinę), rejestr zdarzeń i nakładkę parametrów.
        # Osobnego, dłuższego przebiegu nie ma z rozmysłu: rozjazd w losowaniu
        # zdarzeń widać w pierwszej dobie tak samo jak w setnej, a 400 dób razy
        # dwa przebiegi to trzynaście minut bramki, która niczego więcej nie łapie.
        shell: bash
        run: |
          cargo run --release -q -p magnat-headless -- m8miasto --size 4km --days 51             --citizens 3000 --hash-every 1440 --threads 1 --out m8_t1.hashes
          cargo run --release -q -p magnat-headless -- m8miasto --size 4km --days 51             --citizens 3000 --hash-every 1440 --threads 8 --expect m8_t1.hashes
      - name: M9a — sesja gry, dziennik wejść i odtworzenie
        # Kryterium WP2: nagrana sesja odtworzona daje ten sam łańcuch hashy stanu,
        # a komendy odrzucone odrzucają się identycznie. Świat opisuje **plik
        # parametrów**, nie argumenty — to jest zarazem kryterium WP13 („bez ani
        # jednego argumentu opisującego świat").
        shell: bash
        run: |
          cat > m9params.ron <<'RON'
          (
              world: (seed: 7, size: Small4km, epoch: Y1990, profile: Mixed, region: Lowland, difficulty: Normal),
              scenario: (0),
              variant: Worker,
              opts: (citizens: 2000, commute_swaps: 20000, economy: true, micro: false),
          )
          RON
          cargo run --release -q -p magnat-headless -- new-game --from m9params.ron --days 2               --hash-every 720 --price 250 --threads 1 --record m9.log.ron --out m9.hashes
          cargo run --release -q -p magnat-headless -- new-game --replay m9.log.ron --days 2               --hash-every 720 --threads 8 --expect m9.hashes
      - name: M9a/M9c — sesja i sloty, postać gracza, karta inspekcji, nakładki
        # Cztery kryteria M9c naraz (`game/tests/inspect.rs`): pięć wariantów startu
        # daje różne listy kandydatów i kapitał wchodzi do gospodarstwa (WP4); z karty
        # mieszkanki da się dojść do domu, gospodarstwa i pracodawcy i wrócić (WP5);
        # zakładka „Dlaczego" nazywa konkurenta i robi z niego odnośnik w obu językach
        # (WP5); dziewięć nakładek z §14.2 buduje pole, a rezerwacja M10 milczy (WP7).
        run: cargo test --release -p magnat-game -- --include-ignored
      - name: M9b — rdzeń UI i ekrany powłoki rysują się bez karty graficznej
        # Trzy kryteria naraz: brak zmian danych → zero alokacji (WP3), liczebniki
        # i polskie znaki w atlasie (WP3), oraz każdy ekran powłoki w obu językach,
        # w pseudo-lokalizacji i na pięciu skalach (WP14).
        run: |
          cargo test --release -p magnat-ui --test dirty --test i18n
          cargo test --release -p magnat-game --test screens
      - name: M10a — most makro ↔ mezo i historia „na sucho" (WP10.1, WP10.3)
        # Pięć kryteriów naraz: rozwinięcie domyka się z zdjęciem co do grosza,
        # dwa rozwinięcia dają identyczny świat, historia zmienia świat nie ruszając
        # sumy pieniądza, ta sama historia dwa razy daje ten sam świat, a krok
        # zmienny oszczędza kroki bez zmiany sumy.
        run: cargo test --release -p magnat-headless --test macro_lod -- --include-ignored
      # Nazwa w cudzysłowie, bo niesie **dwukropek ze spacją** — w YAML-u to separator
      # klucza od wartości, więc niecytowana wywraca parsowanie **całego pliku**.
      # Do `R2f` tak właśnie było i skutek był taki, że GitHub Actions nie wczytywał
      # tego workflow wcale: żaden job nie biegł od M10a (pozycja 85 wykazu `R2`).
      - name: "M10a — artefakt A fazy M10: raport historii „na sucho”"
        # Przebieg **wypisuje** bramki Etapu 10 i kronikę, a kod wyjścia pilnuje
        # jedynej rzeczy, która jest tu niepodlegająca negocjacji: sumy pieniądza.
        # Czerwone bramki są stanem świata i mają być widoczne w logu, a nie ukryte
        # za zielonym krokiem — dlatego raport idzie do artefaktu.
        shell: bash
        run: |
          cargo run --release -q -p magnat-headless -- dry-run --seed 7 --size 4km             --years 30 --out dryrun.hash | tee raport-dryrun.txt
          cargo run --release -q -p magnat-headless -- dry-run --seed 7 --size 4km             --years 30 --expect dryrun.hash > /dev/null
      - name: E1 — testy, których powód obiecywał CI, a nie wołał ich żaden krok (N1.2)
        # Do E1 każdy z tych plików miał `#[ignore = "… CI uruchamia jawnie"]` i żaden
        # krok go nie wołał — `consistency.rs` od M2e, kopalnia z `full_city.rs` od M6.
        # Pilnuje tego reguła 6 `plan_guard`: `#[ignore]` bez joba albo otwartego punktu
        # jest błędem bramki. Test czerwony po dopięciu nie wraca do cienia — ma
        # `#[ignore = "N<e>.<n>: …"]` z punktem, który go naprawi.
        run: |
          # Macierz 32 ziaren × 4 profile pada na T11 (woda surowa) — `N4.15`, pominięta po nazwie.
          cargo test --release -p magnat-world --test consistency --test lsystem_split -- --include-ignored --skip macierz_32_ziaren_x_4_profile
          cargo test --release -p magnat-world --lib -- --include-ignored miasto_daje_poprawny_graf
          cargo test --release -p magnat-headless --test m10_domkniecie --test full_city --test labor_city --test firms_city --test blackout -- --include-ignored
          cargo test --release -p magnat-agents --test school -- --include-ignored
      - name: M3 — stulecie demografii i progi §7.2 (N1.3)
        # Bieg nocny, jeden system: ~70 s na ziarno w release. Kod wyjścia pilnuje całego
        # przebiegu — nigdy < 1000 mieszkańców, nigdy > 3× startowej, koniec w [0,5×; 2×],
        # pieniądz i tożsamość populacji. Do E1 runner liczył minimum i maksimum tylko do
        # wydruku i nie był wołany przez żaden krok.
        # ponytail: pięć ziaren na jednym rozmiarze miasta; §7.2 mówi o czterech rozmiarach —
        # dołożyć `--homes/--jobs/--seeded`, gdy bieg nocny zmieści kolejne ~6 min.
        if: runner.os == 'Linux' && contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)
        run: |
          for s in 1 2 3 4 5; do
            cargo run --release -q -p magnat-headless -- century --seed "$s" --report-every 50 > /dev/null
          done
      - name: M4 — dowód spójności mikro ↔ mezo (A1–A5, M4d/WP9)
        run: cargo test --release -p magnat-world --test lod -- --include-ignored
      - name: M11 — render, dźwięk i poziom detalu nie zmieniają symulacji (§7.1)
        # Dwa testy integracyjne klienta naraz. `render_nie_dotyka_symulacji` jest
        # rdzeniem DoD fazy M11 (§7.5 pkt 1): ten sam seed, pięć wariantów prezentacji,
        # identyczny ciąg hashy. `snapshot_instancing` sprawdza, że droga
        # sim → snapshot → bufor instancji cokolwiek oddaje — powstał w M11a
        # i **do M11e nie był uruchamiany w CI przez ani jeden krok**.
        # GPU nie jest potrzebne: obie ścieżki kończą się na buforze po stronie procesora.
        run: cargo test --release -p magnat -- --include-ignored
      - name: M4 — diagram IDM zgadza się z tabelą VDF (miernik dryfu R2)
        run: cargo run --release -q -p magnat-balansator -- calibrate-vdf
      - name: T-D8 — test negatywny (chaos musi zawieść)
        shell: bash
        run: |
          cargo build --release -p magnat-headless --features chaos
          if ./target/release/magnat-headless --seed 42 --entities 100000 --ticks 20000 \
              --hash-every 1000 --threads 8 --expect run_1.hashes; then
            echo "build chaos przeszedł test determinizmu — testy nie działają" && exit 1
          fi

  bench-guard:
    name: benchmarki (próg regresji)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: bench
        # Jawna lista crate'ów z benchmarkami, a nie `--workspace`: cargo traktuje każdy
        # cel z `bench = true` jako benchmark, więc `--workspace` próbuje uruchomić także
        # biblioteki i binarki, które nie znają flag criteriona.
        #
        # **Lista była niepełna do R2f** i to widać było dopiero, gdy brak wpisu w linii
        # bazowej stał się błędem. Trzy crate'y wypadły: `magnat-agents` miał sześć pozycji
        # **w linii bazowej i ani jednej w przebiegu**, `magnat-render` jedną w tej samej
        # sytuacji, a `magnat-supply` nie miał ani jednej po żadnej stronie — benchmarki
        # są w repozytorium od M6 i nikt ich nigdy nie zmierzył. Od R2f lista pokrywa
        # **wszystkie** crate'y z sekcją `[[bench]]`; `instancing_bench` z `magnat-render`
        # nie dotyka przy tym karty graficznej (mierzy kompakcję instancji po stronie
        # procesora), więc runner bez GPU liczy go bez zmian.
        run: |
          cargo bench -p magnat-core -p magnat-ecs -p magnat-io                       -p magnat-voxel -p magnat-world -p magnat-nav -p magnat-spatial                       -p magnat-traffic -p magnat-economy -p magnat-firms -p magnat-ui                       -p magnat-macro -p magnat-game -p magnat-agents -p magnat-supply -p magnat-render --benches                       -- --warm-up-time 1 --measurement-time 3
      - name: test wykrywacza
        # Bramka, która nigdy nie świeci na czerwono, nie jest bramką — ta sama
        # zasada co w `struct-guard`. Przed R2-WP33 `bench_guard` nie miał testu
        # samego siebie i przez to nie zauważył, że dla trzynastu z czterdziestu
        # jeden pozycji nie mierzył niczego.
        run: python3 scripts/bench_guard.py --self-test
      - name: porównanie z linią bazową (10 % ostrzeżenie, 25 % błąd — D-8)
        # Brak wpisu w linii bazowej jest od R2-WP33 **błędem**, nie komunikatem
        # `NOWY`: benchmark bez linii bazowej to benchmark, którego nikt nie ogląda.
        run: python3 scripts/bench_guard.py benches/baseline.json
      # Linia bazowa powstaje **na tej klasie maszyny, na której jest porównywana**
      # (N1.15-a). Do E1 nagrywano ją lokalnie, a porównywano z runnerem — 37 × BŁĄD
      # od +26 % do +432 % było różnicą sprzętu, nie regresją. Odnowienie:
      #   gh run download <id> -n criterion -D target/criterion
      #   python scripts/bench_guard.py benches/baseline.json --update
      # i w opisie commita identyfikator biegu zamiast nazwy sprzętu.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion
          path: target/criterion/**/new/estimates.json

  struct-guard:
    name: kontrola strukturalna (progi R1 §6)
    runs-on: ubuntu-latest
    # `continue-on-error` zeszło przy domknięciu R1 — job jest bramką, nie raportem.
    # Warunek z R-WP1 został spełniony: kolumna „błąd" pokazuje zera poza wyjątkami,
    # a wyjątki nie są zwolnieniem symbolu, tylko **zamrożeniem stanu** — klucz
    # w `REJESTR` niesie wartość, więc dopisanie jednej linii do zwolnionej funkcji
    # zapala bramkę z powrotem. Każda pozycja ma wiersz w rejestrze długu w
    # `R1-refaktor-po-M5.md`, z nazwanym sufitem i fazą-właścicielem.
    steps:
      - uses: actions/checkout@v4
      - name: test wykrywacza
        # Bramka, która nigdy nie świeci na czerwono, nie jest bramką — ta sama
        # zasada co w `sim/economy/tests/single_entry_point.rs` (M5a).
        run: python3 scripts/struct_guard.py --self-test
      - name: cztery metryki na całym repozytorium i rejestr długu
        # `--all` sprawdza od R2-WP26 także **adresatów rejestru długu**: czy faza,
        # do której pozycja jest zaadresowana, ma dokument i czy jeszcze się nie
        # zamknęła. Pozycja, której adresat minął, jest błędem bramki — przez siedem
        # faz nie było tego czym sprawdzić i 55 pozycji z 68 zostało bez właściciela.
        run: python3 scripts/struct_guard.py --all

  plan-guard:
    name: opis zgadza się z rzeczą (R2-WP23, R2-WP26)
    runs-on: ubuntu-latest
    # `README.md` jest jedynym plikiem, który ktoś z zewnątrz przeczyta pierwszy,
    # a jego nagłówek stanu przeżył sześć faz bez jednej poprawki — nie dlatego,
    # że ktoś go bronił, tylko dlatego, że nie miał z czym się nie zgadzać.
    #
    # Od R2-WP26 ta sama bramka pilnuje **obietnic z tabel korekt**: wiersz, który
    # wskazuje cudzy dokument, musi mieć w nim pokrycie. Bez tego `K-18` działa
    # na papierze — sprawdzenie dwudziestu takich wierszy dało osiem bez pokrycia.
    #
    # Reguła 4 sprawdza **ten plik**: czy w ogóle daje się wczytać. Do R2f nie dawał
    # się od M10a — jedna nazwa kroku z niecytowanym dwukropkiem i GitHub Actions
    # nie ładował całego workflow, czyli nie biegł ani jeden job (poz. 85 wykazu `R2`).
    # Ten krok jest przez to **drugą linią**, nie pierwszą: pierwszą jest to samo
    # wywołanie przed commitem, bo bramka w CI nie może bronić pliku, od którego CI zależy.
    steps:
      - uses: actions/checkout@v4
      - name: test wykrywacza
        run: python3 scripts/plan_guard.py --self-test
      - name: bramka
        run: python3 scripts/plan_guard.py

  lang-guard:
    name: granicą języka jest crate (R2-WP27, D-N19)
    runs-on: ubuntu-latest
    # Bramka zamraża konwencję, a nie znajduje usterkę — i to jest jej rola.
    # Znalazła przy tym siedem identyfikatorów z diakrytykiem, które przeżyły
    # w repozytorium, bo nikt tej konwencji nigdzie nie zapisał.
    steps:
      - uses: actions/checkout@v4
      - name: test wykrywacza
        run: python3 scripts/lang_guard.py --self-test
      - name: identyfikatory w ASCII
        run: python3 scripts/lang_guard.py

  macro-kernel:
    name: sim/macro woła jądro, nie liczy sam (M10a/WP10.2)
    runs-on: ubuntu-latest
    # Reguła „`sim/macro` nie zawiera logiki ekonomicznej" (M10a §5.1, `K-50`) jest
    # jedyną obroną przed ryzykiem R1 fazy M10: dwoma modelami gospodarki, które
    # rozjeżdżają się po trzech sprintach i których rozjazdu nie widać w żadnym
    # teście, bo oba są zielone osobno. Reguła w dokumencie nie broni się sama.
    steps:
      - uses: actions/checkout@v4
      - name: test wykrywacza
        run: python3 scripts/macro_kernel_guard.py --self-test
      - name: bramka
        run: python3 scripts/macro_kernel_guard.py

  balansator:
    name: bramki balansatora (G1–G12, M5e/WP13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release -p magnat-balansator
      # Dwa profile, bo bramki mają dwa różne budżety czasu (§7.4). Profil `ci`
      # bierze G1–G3, G5 i G7–G9 na scenariuszu odniesienia; profil nocny dokłada
      # G4 (reaktywność szoku) i G6 (koncentracja), bo obie potrzebują scenariusza
      # szokowego i przebiegu dłuższego niż okno wygaszania 14–56 dób.
      #
      # **Liczby odbiegają od §7.4 i to jest jawna korekta, nie niedopatrzenie.**
      # Plan mówił 8 ziaren × 365 dób w budżecie 10 minut; zmierzone na tym
      # repozytorium: doba miasta 3 tys. mieszkańców to ~1,6 s, czyli 365 dób to
      # ~9,7 min **na jedno ziarno**. Źródło kosztu jest nazwane w `U-24` i nie
      # leży w gospodarce: każdy zakup to dwa wywołania routera M4. Do czasu, aż
      # ktoś to skróci, bramka pull requesta bierze krótszy przebieg, a pełną
      # macierz puszcza bieg nocny — lepiej mieć bramkę, która biegnie, niż
      # zgodną z planem, którą ktoś wyłączy po trzecim przekroczeniu limitu.
      - name: profil ci — scenariusz odniesienia
        if: ${{ !contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) }}
        run: |
          cargo run --release -q -p magnat-balansator -- run \
            --seeds 4 --days 120 --scenario base --out runs/ --jobs 4
          cargo run --release -q -p magnat-balansator -- gate runs/ --profile ci
      - name: profil nocny — pełna macierz i scenariusze szokowe
        if: contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)
        run: |
          for s in base supply-shock player-price-war income-shock; do
            cargo run --release -q -p magnat-balansator -- run \
              --seeds 8 --days 365 --scenario "$s" --out runs/ --jobs 8
          done
          cargo run --release -q -p magnat-balansator -- gate runs/ \
            --profile nightly --report raport-balansatora.md
      # Druga połowa kryterium WP9 fazy M6 (`R2-WP34`). Bieg nocny, bo 60 dób miasta
      # 4 km to ~2 minuty, a scenariusz mierzy **opóźnienie** reakcji cen na szok —
      # przebieg krótszy niż okno 14 dób nie ma czego zmierzyć.
      #
      # Kod wyjścia pilnuje jednej rzeczy: czy w mieście jest w ogóle czym handlować.
      # Same krzywe idą do artefaktu, bo „cena nie drgnęła" jest **wynikiem pomiaru**,
      # a nie awarią — i ma być widoczne, a nie ukryte za czerwonym krokiem.
      - name: export_drains — odpływ masy i cena półkowa po szoku +40 %
        if: contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)
        run: |
          cargo run --release -q -p magnat-headless -- export-drains             --seed 1 --size 4km --days 60 --citizens 3000 | tee raport-export-drains.txt
      - uses: actions/upload-artifact@v4
        if: contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)
        with:
          name: raport-balansatora
          path: |
            raport-balansatora.md
            raport-export-drains.txt

  budzety:
    name: raport budżetów M1 (pamięć, czas generacji)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: testy budżetowe
        # Budżety z §5.9 i §7.3 są **asercjami**, nie wykresem: przekroczenie wywraca job.
        # Raport jest artefaktem, żeby dało się zobaczyć zapas, a nie tylko fakt, że limit
        # nie pękł. FPS nie wchodzi tutaj — runner CI nie ma GPU (§7.5), więc przelot
        # kamery mierzy się na maszynie z kartą (`magnat --bench`).
        run: |
          cargo test --release -p magnat-world --test budgets --test mesh_budget             -- --include-ignored --nocapture | tee raport-budzetow.txt
          # Dwa budżety czasu spoza `sim/world`, które do E1 nie biegły nigdzie (N1.2):
          # p95 zapytania CCH i dwa tysiące kampanii w jednym ticku.
          cargo test --release -p magnat-nav --lib -- --include-ignored --nocapture pomiar_p95_zapytania_cch | tee -a raport-budzetow.txt
          cargo test --release -p magnat-media --test reach -- --include-ignored --nocapture | tee -a raport-budzetow.txt
      - uses: actions/upload-artifact@v4
        with:
          name: raport-budzetow
          path: raport-budzetow.txt
