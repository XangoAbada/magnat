[package]
name = "magnat-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Testy jednostkowe nie są benchmarkami. Bez tego `cargo bench` próbuje uruchomić
# bibliotekę jako bench target i przewraca się na flagach criteriona, których libtest
# nie zna — a bramka regresji z D-8 przestaje działać, zanim cokolwiek zmierzy.
[lib]
bench = false

[dependencies]
magnat-core = { workspace = true }
magnat-jobs = { workspace = true }
magnat-spatial = { workspace = true }
magnat-voxel = { workspace = true }
glam = { workspace = true }
smallvec = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
zstd = { workspace = true }
ron = { workspace = true }

[dev-dependencies]
ron = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "world_bench"
harness = false
