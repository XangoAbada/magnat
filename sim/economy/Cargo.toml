[package]
name = "magnat-economy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Testy jednostkowe nie są benchmarkami — patrz komentarz w `engine/ecs/Cargo.toml`.
[lib]
bench = false

[dependencies]
magnat-core = { workspace = true }
magnat-ecs = { workspace = true }
magnat-jobs = { workspace = true }
magnat-spatial = { workspace = true }
# M5b wpina się w symulację przez `sim::agents::Sources.places` (`Z-1`), więc musi
# implementować `PlaceProvider` — zależność idzie w tę stronę i tylko w tę:
# `sim/agents` nie widzi gospodarki i widzieć jej nie może (cykl z `K-8`).
magnat-agents = { workspace = true }
# Od WP11 (M6d) półka sklepu bierze towar z magazynu M6, a nie z powietrza — zależność
# przestała być testowa. Kierunek jest jednokierunkowy i taki zostaje: `sim/supply`
# jest crate'em liściastym i o gospodarce detalicznej nie wie nic.
magnat-supply = { workspace = true }
# Rynek pracy M7b mieszka tutaj (`D2`), ale **reguły firmy** — scoring kandydata,
# krok licytacji, sufit marży — zostają u M7. Zależność idzie `economy → firms`
# i odwrócić się nie da: `sim/firms` stoi na maszynerii ofert tego crate'a.
magnat-firms = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }

[dev-dependencies]
# Hash stanu świata mieszka w `engine/io` — testem bramki 2 jest porównanie hashy,
# a nie inspekcja własnych struktur.
magnat-io = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

[features]
# Dostawca zewnętrzny tworzący masę z niczego (M5). Do M6d był **jedyną** drogą,
# którą towar trafiał na półkę; od WP11 jest wyłączony domyślnie i zostaje wyłącznie
# do izolowanych testów warstwy detalicznej oraz do scenariuszy balansatora badających
# samą półkę (M6 §6.3 krok 2). Włączenie go łamie `prop_mass_conservation` i ma łamać.
infinite_supply = []

[lints]
workspace = true

[[bench]]
name = "economy_bench"
harness = false
