[package]
name = "magnat-firms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Testy jednostkowe nie są benchmarkami — patrz komentarz w `engine/ecs/Cargo.toml`.
[lib]
bench = false

[dependencies]
magnat-core = { workspace = true }
magnat-ecs = { workspace = true }
# Katalog towarów i receptur — walidator typów zakładów sprawdza, czy receptura
# archetypu istnieje. `sim/supply` zależy wyłącznie od `core` i `ecs`, więc nie
# wnosi tu ciężaru; zależność w drugą stronę nie istnieje i istnieć nie może.
magnat-supply = { workspace = true }
# Mieszkaniec jako pracownik: `Vitals`, `Skills`, komponent `Employment` (link D1).
magnat-agents = { workspace = true }
# Silnik reguł (`K-11`). Zależność idzie `firms → policy` i odwrócić się nie może:
# polityka nie wie, czym jest firma, a firma nosi politykę w delegacji zakładu.
magnat-policy = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]
# Pusta polityka w teście hasha — delegacja bez niej nie powstanie.
magnat-policy = { workspace = true }
# Hash stanu świata mierzy się jego jedynym wejściem (`world_state_hash`),
# a nie kopią funkcji haszującej w teście.
magnat-io = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true

# Budżet decyzji firmy (M7e WP11, §7.6). Czas mierzy się **wyłącznie** tutaj —
# w symulacji budżet jest liczbą firm na tick (§5.6, 00 §3.5).
[[bench]]
name = "firms_bench"
harness = false
