[package]
name = "magnat-supply"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Testy jednostkowe nie są benchmarkami — patrz komentarz w `engine/ecs/Cargo.toml`.
[lib]
bench = false

[dependencies]
magnat-core = { workspace = true }
# Od M6e łańcuch ma **własny** system w harmonogramie (`AO-2`, `AP-4`) — do M6d
# kadencję wołał `MarketSystem` z `sim/economy`, czyli M5 prowadził zegar M6.
magnat-ecs = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "supply_bench"
harness = false

[lints]
workspace = true
