[package]
name = "magnat-city"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Testy jednostkowe nie są benchmarkami — patrz komentarz w `engine/ecs/Cargo.toml`.
[lib]
bench = false

[dependencies]
magnat-core = { workspace = true }
magnat-ecs = { workspace = true }
# Pieniądz rusza się **wyłącznie** przez `Books::transfer` (M5). Miasto jest zwykłym
# posiadaczem konta (`AccountOwner::City`), a nie wyjątkiem od niezmiennika podaży.
# Stąd też bierze się kierunek zależności: `city → economy`, nigdy odwrotnie —
# `CityTaxEngine` wypełnia hak `TaxEngine`, który M5 zostawił u siebie.
# Obsada placowek publicznych: komponent `Employment` mieszkanca (M8d WP7).
magnat-agents = { workspace = true }
magnat-economy = { workspace = true }
# Kontrola skarbowa jest **zdarzeniem**, a nie drugim losowaniem (`CF-1`):
# miasto czyta rejestr zdarzen i otwiera sprawe, a hazard liczy `sim/events`.
magnat-events = { workspace = true }
# Rejestr firm i zakładów: podstawa CIT, koncesji i pokrycia listą płac.
magnat-firms = { workspace = true }
# Katalog towarów (klucz towaru → klasa VAT i stawka akcyzy) oraz rozliczenia B2B.
magnat-supply = { workspace = true }
# Sieci przesyłowe: uchwała o suficie taryfy przestawia cenę operatora u niego
# (M8e, `CD-5`). Kierunek `city → traffic` jest jednostronny i bezpieczny —
# `sim/traffic` nie wie o mieście i wiedzieć nie musi; to ten sam wzorzec,
# którym `sim/events` nakłada parametry na pola właścicieli (`CE-4`).
magnat-traffic = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
