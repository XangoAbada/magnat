[package]
name = "magnat-headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "magnat_headless"
path = "src/lib.rs"
# Testy jednostkowe nie są benchmarkami — patrz komentarz w `engine/ecs/Cargo.toml`.
bench = false

[[bin]]
name = "magnat-headless"
path = "src/main.rs"
bench = false

[features]
default = []
# Test negatywny T-D8: celowo wstrzyknięty niedeterminizm w jednym systemie.
chaos = []

[dependencies]
magnat-core = { workspace = true }
magnat-ecs = { workspace = true }
magnat-jobs = { workspace = true }
magnat-io = { workspace = true }
magnat-devtools = { workspace = true }
magnat-agents = { workspace = true }
magnat-ui = { workspace = true }
magnat-traffic = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
magnat-nav = { workspace = true }
magnat-world = { workspace = true }
magnat-economy = { workspace = true }
# Katalog presetów polityk — most stawiający miasto wpina go do świata razem
# z tablicą publiczną cen (M7e WP10, `AZ-1`).
magnat-policy = { workspace = true }
magnat-firms = { workspace = true }
# Most stawia łańcuch dostaw razem z rynkiem: od WP11 (M6d) półka bierze towar
# z magazynu M6, więc scenariusz, klient i balansator muszą go dostać zbudowanego.
magnat-supply = { workspace = true }
magnat-voxel = { workspace = true }
magnat-spatial = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
