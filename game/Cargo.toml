[package]
name = "magnat-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "magnat_game"
path = "src/lib.rs"
# Testy jednostkowe nie są benchmarkami — patrz komentarz w `engine/ecs/Cargo.toml`.
bench = false

[dependencies]
magnat-core = { workspace = true }
magnat-ecs = { workspace = true }
magnat-jobs = { workspace = true }
magnat-io = { workspace = true }
# Lokalizacja: `Settings` trzyma język gracza, a `Locale` mieszka w `engine/ui`
# od M3d. Crate jest bez GPU, więc zależność nie wnosi `wgpu` (bramka R-5).
magnat-ui = { workspace = true }
magnat-world = { workspace = true }
magnat-voxel = { workspace = true }
magnat-agents = { workspace = true }
magnat-traffic = { workspace = true }
# Panel marki nazywa krawędź drogi, przy której gracz stawia billboard (`WP10.19`).
# Zależność jest już w grafie przez ruch i media — to jest nazwa typu, nie nowy kod.
magnat-nav = { workspace = true }
magnat-economy = { workspace = true }
magnat-supply = { workspace = true }
magnat-firms = { workspace = true }
magnat-policy = { workspace = true }
magnat-macro = { workspace = true }
magnat-media = { workspace = true }
magnat-city = { workspace = true }
magnat-events = { workspace = true }
magnat-spatial = { workspace = true }
# Kanał sim → render: `game` jest jedynym miejscem, które widzi naraz ruch, mieszkańców
# i miasto, więc to ono składa rekordy snapshotu (M11a WP2).
magnat-sim-snapshot = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
# Ekrany powłoki (WP14, `DE-7`). `egui` jest czystym procesorem bez GPU — rysowanie
# trójkątów należy do `engine/render::ui` — więc bramka R-5 (zakaz `wgpu`
# w przebiegu bezgłowym) nie drgnęła, a każdy ekran da się narysować w CI.
egui = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

# Budżety grafu, Gantta i przebudowy panelu z §7 dokumentu fazy M9 (`R2-WP29`).
# Stoją tutaj, a nie w `engine/ui/benches/`, bo `PanelDesc::build` mieszka w tym
# crate'cie — patrz nagłówek pliku.
[[bench]]
name = "ui_budgets"
harness = false

[lints]
workspace = true
